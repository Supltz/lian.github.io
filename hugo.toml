  [params.hero]
  enable = true
  intro = ""
  title = ""
  subtitle = ""
  content = """
My name is Tangzheng Lian, and I am currently a final-year PhD candidate in the [Social AI & Robotics Lab (SAIR)](https://sairlab.github.io/), led by [Dr. Oya Celiktutan](https://oceliktutan.github.io/), in the Department of Engineering at King’s College London. Since August 2026, I have also been a Research Intern at Huawei's London Darwin Research Center. I am fortunate to be fully funded by the competitive Natural, Mathematical & Engineering Sciences (NMES) Faculty PhD Studentship at King’s. During my PhD, I have also had the opportunity to work with [Dr Dimitrios Kollias](https://sites.google.com/view/dimitrioskollias/home) at Queen Mary University of London (QMUL).

Prior to King’s, I was a Research Assistant at the Computing and Informatics Research Center (CIRC) at Nottingham Trent University, where I worked with [Dr. Doratha Vinkemeier](https://scholar.google.com/citations?user=gyBNKOgAAAAJ&hl=en). I completed my MSc in Computer Science (Distinction) at the University of Birmingham and a BEng in Telecommunication Engineering at Beijing University of Posts and Telecommunications (BUPT).

"""
