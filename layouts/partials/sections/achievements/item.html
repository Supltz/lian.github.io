<article class="publication">
  <div class="publication-venue">
    <span class="venue-name">{{ .venue }}</span>
    <div class="venue-details">
      <span class="venue-year">{{ .year }}</span>
      {{ with .distinction }}<span class="venue-distinction">{{ . }}</span>{{ end }}
    </div>
  </div>
  <div class="publication-content">
    <h3 class="publication-title"><a href="{{ .paper }}" target="_blank" rel="noopener noreferrer">{{ .title }}</a></h3>
    <p class="publication-authors">{{ .authors | markdownify }}</p>
  </div>
</article>
