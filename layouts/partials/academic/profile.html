<aside class="profile-sidebar" aria-label="Personal profile">
  <img class="profile-photo" src="{{ .Site.Params.hero.image | relURL }}" alt="{{ .Site.Params.title }}" width="188" height="188" fetchpriority="high">
  <div class="profile-details">
    {{ if .IsHome }}<h1 class="profile-name">{{ .Site.Params.title }}</h1>{{ else }}<p class="profile-name"><a href="{{ .Site.Home.RelPermalink }}">{{ .Site.Params.title }}</a></p>{{ end }}
    <p class="profile-affiliation">{{ .Site.Params.profile.role }}<br>{{ .Site.Params.profile.affiliation }}</p>
    <p class="profile-position">{{ .Site.Params.profile.position }}</p>
    {{ partial "sections/hero/social.html" . }}
  </div>
</aside>
