{{ if .Site.Params.contact.enable }}
<section id="contact" class="page-section" data-section aria-labelledby="contact-heading">
  <h2 id="contact-heading" class="section-heading">{{ .Site.Params.contact.title }}</h2>
  <p>Email: <a href="mailto:{{ .Site.Params.profile.email }}">{{ .Site.Params.profile.email }}</a></p>
</section>
{{ end }}
